<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Pedidos">
  <!-- Isotipo de la plataforma. Toda la geometría cae en coordenadas PARES
       sobre la grilla de 32 → a 16 px (pestaña), 32 px (retina) y 48 px cada
       borde coincide con un píxel entero y el ícono sale nítido, sin el
       antialiasing gris que tenía la versión anterior. Si se retoca, mantener
       los valores pares. -->
  <rect width="32" height="32" rx="8" fill="#e11d48"/>
  <g fill="#fff">
    <!-- Tenedor: 3 dientes de 2 px separados por 2 px, cuello y mango -->
    <rect x="6" y="6" width="2" height="8"/>
    <rect x="10" y="6" width="2" height="8"/>
    <rect x="14" y="6" width="2" height="8"/>
    <rect x="6" y="12" width="10" height="4" rx="2"/>
    <rect x="10" y="14" width="2" height="12" rx="1"/>
    <!-- Cuchillo: lomo recto a la derecha, hoja hacia la izquierda -->
    <path d="M26 6v20a1 1 0 0 1-2 0v-8h-2v-8a4 4 0 0 1 4-4Z"/>
  </g>
</svg>
